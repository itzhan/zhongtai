services:
  app:
    build: .
    image: zhongtai:latest
    container_name: zhongtai
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3181}:3100"
    environment:
      DATABASE_URL: file:/app/data/app.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
